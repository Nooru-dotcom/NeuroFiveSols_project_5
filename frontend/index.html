<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Job Application Form</h1>
  <p class="subtitle">Fill out the details below to apply</p>

  <div id="banner" class="banner hidden"></div>

  <form id="applicationForm" novalidate>

    <div class="field">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" placeholder="e.g. Ali Raza">
      <span class="error" id="err_full_name"></span>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="text" id="email" name="email" placeholder="e.g. ali@example.com">
      <span class="error" id="err_email"></span>
    </div>

    <div class="field">
      <label for="phone">Phone Number</label>
      <input type="text" id="phone" name="phone" placeholder="e.g. +92-300-1234567">
      <span class="error" id="err_phone"></span>
    </div>

    <div class="field">
      <label for="department">Department</label>
      <select id="department" name="department">
        <option value="">Select a department</option>
        <option value="engineering">Engineering</option>
        <option value="design">Design</option>
        <option value="marketing">Marketing</option>
        <option value="sales">Sales</option>
        <option value="hr">HR</option>
        <option value="finance">Finance</option>
      </select>
      <span class="error" id="err_department"></span>
    </div>

    <div class="field">
      <label for="date_of_birth">Date of Birth</label>
      <input type="date" id="date_of_birth" name="date_of_birth">
      <span class="error" id="err_date_of_birth"></span>
    </div>

    <div class="field">
      <label for="bio">Short Bio (optional)</label>
      <textarea id="bio" name="bio" rows="4" placeholder="Tell us a little about yourself..."></textarea>
      <span class="error" id="err_bio"></span>
    </div>

    <div class="field">
      <label for="photo">Profile Photo</label>
      <input type="file" id="photo" name="photo" accept=".png,.jpg,.jpeg,.gif,.webp">
      <span class="error" id="err_photo"></span>
    </div>

    <button type="submit" id="submitBtn">
      <span id="btnText">Submit Application</span>
      <span id="spinner" class="spinner hidden"></span>
    </button>

  </form>
</div>

<script src="script.js"></script>
</body>
</html>
